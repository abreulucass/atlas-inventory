services:
  postgres:
    image: postgres:18-alpine # keep in sync with TestcontainersConfiguration
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local only, fictitious
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "atlas"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
