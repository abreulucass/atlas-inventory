# Betterleaks config, passed explicitly with --config (it is not auto-loaded).
# Top-level keys must come BEFORE [extend], or TOML puts them inside that table.

# Known false positives: skip files by path regex; justify each entry. Example:
# prefilter = '''
# filter.matchesAny(attributes["path"], [
#   `^design/.*\.pen$`, # design file token, not a credential
# ])
# '''

[extend]
useDefault = true
