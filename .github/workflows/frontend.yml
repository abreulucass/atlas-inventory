name: Frontend

# push limited to long-lived branches: PR branches are already covered by pull_request.
on:
  push:
    branches: [main, develop]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  check:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # The dummy URL must never reach the browser bundle (check:bundle).
      - name: Build and check the bundle
        env:
          ATLAS_API_URL: http://atlas-api.invalid:8080
        run: |
          npm run build
          npm run check:bundle

  e2e:
    name: Frontend (Playwright against the backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start PostgreSQL
        working-directory: backend
        run: docker compose up -d --wait

      - name: Start the backend
        working-directory: backend
        env:
          ATLAS_JWT_SECRET: ci-only-dummy-secret-ci-only-dummy-0123 # fictitious, CI only
        run: nohup ./mvnw -B -q spring-boot:run > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for the backend
        run: |
          for i in $(seq 1 90); do
            curl -fs http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          ATLAS_API_URL: http://localhost:8080
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/backend.log
          retention-days: 7
