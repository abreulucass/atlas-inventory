version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci # Conventional Commits: "ci(deps): bump ..."
      include: scope
    groups:
      actions:
        patterns: ["*"]

